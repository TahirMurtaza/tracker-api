[project]
name = "tracker-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115", "uvicorn[standard]>=0.30", "sqlalchemy[asyncio]>=2.0.30", "asyncpg>=0.29",
  "alembic>=1.13", "pydantic>=2.7", "pydantic-settings>=2.3", "argon2-cffi>=23.1",
  "pyjwt>=2.8", "redis>=5.0", "arq>=0.26", "boto3>=1.34", "python-multipart>=0.0.9",
  "email-validator>=2.1",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27", "pytest-cov>=5", "moto[s3]>=5", "ruff"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing"


[tool.coverage.run]
source = ["app"]
concurrency = ["greenlet", "thread"]  # SQLAlchemy async runs on greenlets; without this coverage under-reports
